services:
  - type: web
    name: gyd-backend
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health?fast=1
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: gyd_marketplace
      - key: AUTH_SECRET
        generateValue: true
      - key: GYD_ADMIN_EMAIL
        value: admin@getyourdesigner.in
      - key: GYD_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
